name: database-check

on:
  push:
    paths:
      - "database/**"
      - ".github/workflows/database-check.yml"
  pull_request:
    paths:
      - "database/**"
      - ".github/workflows/database-check.yml"
  workflow_dispatch:

jobs:
  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: momentia
          POSTGRES_PASSWORD: momentia_test
          POSTGRES_DB: momentia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U momentia -d momentia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://momentia:momentia_test@localhost:5432/momentia_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply schema migrations
        run: bash database/scripts/migrate.sh
      - name: Verify migration runner is idempotent
        run: bash database/scripts/migrate.sh
      - name: Verify migration ledger
        run: test "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM schema_migrations")" = "5"
      - name: Run integrity checks
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/constraints.sql
      - name: Load synthetic development data
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/seeds/development.sql
      - name: Validate representative query plans
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/queries/representative.sql
      - name: Run 10k-row synthetic timeline smoke test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/tests/load_smoke.sql
      - name: Verify PostgreSQL backup and restore
        run: bash database/tests/backup_restore.sh

      - name: Verify local SQLite schema
        run: python database/local/verify_schema.py
      - name: Verify concurrent COUPLE membership invariant
        run: bash database/tests/concurrency.sh
