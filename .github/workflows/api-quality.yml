name: API quality

on:
  push:
    branches:
      - main
      - docs/arquitectura-y-alcance-v1
      - feature/**
  pull_request:
    paths:
      - 'services/api/**'
      - '.github/workflows/api-quality.yml'

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --coverage
      - name: Build
        run: npm run build
